name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dist/**", "src/vorlage/**", "src/build_vorlage.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fachschaftsvorlage bauen und prüfen
        run: node src/build_vorlage.js
      - name: Syntax prüfen
        run: node --check dist/app.js && node --check dist/data.js && node --check dist/vorlage.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
