<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matheplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a teacher's day planner — sticky top bar with views; "Heute" shows one card per class with today's lessons and the review queue. */
:root{
  --paper:#f4f7f9; --sheet:#ffffff; --ink:#1d2a33; --muted:#5f6d74; --line:#dbe3e7; --soft:#eef3f6; --accent:#0079a8; --accent-ink:#ffffff; --accent-bg:#e3f3fa;
  --brand-blue:#0094cd; --brand-orange:#f59b0a; --brand-green:#afca0b; --brand-red:#d91016;
  --tile-blue:#0079a8; --tile-orange:#b86a00; --tile-green:#647700; --tile-red:#c0141a; --tile-slate:#3d5361;
  --ok:#5b6d00; --ok-bg:#f1f7d6; --warn:#c0141a; --warn-bg:#fde6e6;
  --lb1:#0079a8; --lb1-bg:#e3f3fa; --lb2:#a85f00; --lb2-bg:#fff1dc; --lb3:#5b6d00; --lb3-bg:#f1f7d6; --lb4:#7a5aa8; --lb4-bg:#eee7f7;
  --lb5:#b8434a; --lb5-bg:#f8e3e4; --wb:#8a7a2a; --wb-bg:#f3efd6; --test:#33424c; --test-bg:#dfe5e9; --start:#55707e; --start-bg:#e8eef1; --buf:#7d898f; --buf-bg:#eff1f2;
  --r1:#b8434a; --r2:#b5741c; --r3:#2f7a45; --r4:#1f5f8b;
  --bx-ink:#ffffff; --buf-bx:#66737a; --wb-bx:#776a22;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10171c; --sheet:#172128; --ink:#e5ebee; --muted:#9aa8b0; --line:#2b3a44; --soft:#1d2a32; --accent:#4fc0ec; --accent-ink:#06202c; --accent-bg:#13394a;
  --tile-blue:#006f9a; --tile-orange:#9a5800; --tile-green:#566600; --tile-red:#a51117; --tile-slate:#34495a;
  --ok:#c4dc4a; --ok-bg:#2b3410; --warn:#ff7f7f; --warn-bg:#3d1c1c;
  --lb1:#4fc0ec; --lb1-bg:#13394a; --lb2:#f7b44a; --lb2-bg:#3d2a0c; --lb3:#c4dc4a; --lb3-bg:#2b3410; --lb4:#b39ae0; --lb4-bg:#2c2440;
  --lb5:#e8858b; --lb5-bg:#3d1e21; --wb:#d2c27a; --wb-bg:#353016; --test:#c9d4da; --test-bg:#2e3a42; --start:#a5bcc7; --start-bg:#22313a; --buf:#8e9ca3; --buf-bg:#1f282e;
  --r1:#e8858b; --r2:#e3a957; --r3:#7dc48b; --r4:#7fb7dd; --bx-ink:#10171c; --buf-bx:var(--buf); --wb-bx:var(--wb); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10171c; --sheet:#172128; --ink:#e5ebee; --muted:#9aa8b0; --line:#2b3a44; --soft:#1d2a32; --accent:#4fc0ec; --accent-ink:#06202c; --accent-bg:#13394a;
  --tile-blue:#006f9a; --tile-orange:#9a5800; --tile-green:#566600; --tile-red:#a51117; --tile-slate:#34495a;
  --ok:#c4dc4a; --ok-bg:#2b3410; --warn:#ff7f7f; --warn-bg:#3d1c1c;
  --lb1:#4fc0ec; --lb1-bg:#13394a; --lb2:#f7b44a; --lb2-bg:#3d2a0c; --lb3:#c4dc4a; --lb3-bg:#2b3410; --lb4:#b39ae0; --lb4-bg:#2c2440;
  --lb5:#e8858b; --lb5-bg:#3d1e21; --wb:#d2c27a; --wb-bg:#353016; --test:#c9d4da; --test-bg:#2e3a42; --start:#a5bcc7; --start-bg:#22313a; --buf:#8e9ca3; --buf-bg:#1f282e;
  --r1:#e8858b; --r2:#e3a957; --r3:#7dc48b; --r4:#7fb7dd; --bx-ink:#10171c; --buf-bx:var(--buf); --wb-bx:var(--wb); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(24px,3.4vw,32px)} h2{font-size:20px} h3{font-size:15px;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .nowrap{white-space:nowrap} .center{text-align:center}
.neg{color:var(--warn)}

/* Layout: Seitenleiste mit Felszeichen, Navigation und vollem Logo; rechts Auswahlleiste und Inhalt */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 12px;z-index:6}
.side .mk{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin:0 4px 14px}
.side .mk img{height:44px;width:auto}
.side .mk span{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
#nav{display:flex;flex-direction:column;gap:2px;min-width:0}
#nav a{padding:8px 12px;border-radius:7px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500}
#nav a:hover{background:var(--soft);color:var(--ink)}
#nav a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);box-shadow:inset 3px 0 0 var(--brand-blue)}
.side .full{margin-top:auto;width:100%;max-width:176px;padding:20px 6px 0;align-self:center}
.col{min-width:0}
.ctxbar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.ctx{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:9px 16px}
.ctx select{font-family:var(--f-mono);font-size:13px;padding:5px 6px;width:auto}
.ctx .ctxl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.ctx .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctx .grades{align-items:center}
.ctx .grades .lbl{padding:0 4px 0 6px}
.ctx .grades button{min-width:30px;padding:4px 6px;font-family:var(--f-mono)}
.ctx .seg button:disabled{opacity:.35;cursor:not-allowed}
#banner{max-width:1208px;margin:10px 16px 0;padding:8px 14px;border-radius:6px;background:var(--soft);font-size:13px}
#banner[data-kind="off"],#banner[data-kind="err"],#banner[data-kind="quota"]{background:var(--warn-bg);color:var(--warn)}
main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 32px}
.foot{max-width:1208px;margin:0 auto 24px;padding:12px 16px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot a{color:inherit}
section{display:grid;gap:16px}
.vhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.vhead.sub{margin-top:8px}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:var(--sheet)}
.btn.big{font-size:18px;padding:12px 22px;justify-self:center}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;width:36px;height:36px;font-size:20px;cursor:pointer;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0}
.mini{border:1px solid var(--line);background:var(--sheet);border-radius:4px;min-width:28px;height:28px;cursor:pointer;padding:0 6px}
.mini:disabled{opacity:.35;cursor:default}
.mini.del:hover{border-color:var(--warn);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--sheet);gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg.small button{padding:4px 10px;font-size:13px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
input[type=date],input:not([type]),input[type=number],select,textarea{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:5px 8px;min-width:0}
input.num{width:56px;text-align:center}
textarea{width:100%;font-family:var(--f-mono);font-size:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid2>*{min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-bg);padding:8px 10px;border-radius:6px}
label.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
label.chk{justify-content:flex-start}
.tscroll{overflow-x:auto}

/* chips */
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);color:var(--c);border-radius:4px;padding:1px 7px;font-size:12px;font-family:var(--f-mono);white-space:nowrap}
.chip b{font-weight:500}
.ulink{display:inline-flex;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink);font-weight:600;line-height:1.3}
.ulink b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--c);background:var(--bg);padding:1px 6px;border-radius:4px}
.ulink:hover{text-decoration:underline}
.pill{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.pill.new{border-color:var(--accent);color:var(--accent)}
.pill.lv1{border-color:var(--lb2);color:var(--lb2)} .pill.lv2{border-color:var(--lb1);color:var(--lb1)} .pill.lv3{border-color:var(--ok);color:var(--ok)}
.rtop .pill.lv{margin-right:auto}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}

/* today */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.datebar .dt{min-width:0}
.datebar .dnav{display:flex;gap:6px;flex:none}
.datebar .dnav .iconbtn{width:44px;height:40px}
.dname{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1.15}
.dsub{color:var(--muted);font-size:13px}
.datebar .seg{margin-left:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.tgrid.one{grid-template-columns:minmax(0,1fr)}
.tcard,.lessons,.engine-box{grid-template-columns:minmax(0,1fr)}
.slot>*{min-width:0}
/* Eine Klasse: Stunden links, Wiederholung rechts */
@media (min-width:1100px){
  .tgrid.one .tcard{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px;align-items:start}
  .tgrid.one .tcard>header,.tgrid.one .tcard>.warn{grid-column:1/-1}
  .tgrid.one .engine-box{border-top:0;padding-top:0;border-left:1px solid var(--line);padding-left:20px;align-content:start}
}
.tcard{gap:14px}
.thead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.warn{display:block;background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px;font-size:13px;text-decoration:none}
.lessons{display:grid;gap:10px;align-content:start}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:12px;border-radius:7px;border:1px solid var(--line);border-left:5px solid var(--c,var(--line));background:var(--sheet)}
.slot.done{background:var(--soft)}
.slot.x{opacity:.65;border-left-color:var(--line);border-style:dashed}
.slot.sol{border-left-color:var(--accent)}
.per{font-size:13px;color:var(--muted);padding-top:2px}
.sbody{display:grid;gap:6px;min-width:0;align-content:start}
.stitle{font-weight:500}
.newatoms{background:var(--soft);border-radius:6px;padding:8px 10px}
.newatoms ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}
.newatoms .q{display:block;font-size:12.5px;color:var(--muted)}
/* Formeln (MathJax-SVG) im Textfluss */
span.m.mj{white-space:nowrap}
span.m.mj mjx-container{display:inline}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.next{display:grid;gap:4px;padding:10px 12px;border:1px dashed var(--line);border-radius:7px}
.free{font-weight:500}
.engine-box{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.engine-box header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.engine-box header .btn{margin-left:auto}
.ritem{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:grid;gap:6px}
.rtop{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rq{font-weight:500;font-size:16px}
.ra{font-family:var(--f-mono);background:var(--soft);padding:4px 8px;border-radius:5px;justify-self:start}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
/* Erzeugte Aufgaben (Anemo-Generatoren): Skizze, Antwortauswahl, Lösungsweg */
.racts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gsvg{margin:8px auto 0;background:#fff;border-radius:8px;padding:6px;width:min(360px,100%);box-sizing:border-box}
.gsvg svg{display:block;width:100%;height:auto;max-height:300px}
.gchoices{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.gchoices span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85em;background:var(--sheet)}
.gchoices span.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.rq .gchoices{justify-content:flex-start}
.rq .gsvg{width:min(280px,100%);margin-left:0}
.rq .gsvg svg{max-height:200px}
.ra.gen{font-family:inherit;justify-self:stretch;display:grid;gap:4px}
.gans{font-family:var(--f-mono);font-weight:600}
.gwhy{font-size:13px;color:var(--muted)}
.gsteps{margin:0;padding-left:20px;font-size:13px;color:var(--muted)}
.gline{color:var(--accent)}
.qq.gen{font-size:clamp(22px,3.6vw,38px)}
.qq.gen .gsvg{width:min(480px,100%)}
.qq.gen .gsvg svg{max-height:40vh}
.qa.gen{font-family:inherit;font-size:clamp(18px,2.6vw,28px);display:grid;justify-items:center;padding:16px 12px}
.qa.gen .gans{font-size:2em;line-height:1.2}
.qa.gen .gwhy{font-size:.6em;text-align:center;margin-top:.9em;max-width:60em}
.qa.gen .gsteps{font-size:.6em;text-align:left;margin-top:.6em}
#overlay:fullscreen .qq.gen{font-size:clamp(28px,4.5vw,64px)}
#overlay:fullscreen .qq.gen .gsvg{width:min(70vh,100%)}
#overlay:fullscreen .qa.gen{font-size:clamp(22px,3.4vw,46px)}
.rate{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 4px;cursor:pointer;display:grid;gap:1px;text-align:center}
.rate b{font-size:13.5px} .rate span{font-size:11px;color:var(--muted)}
.rate.r1 b,.r1t{color:var(--r1)} .rate.r2 b,.r2t{color:var(--r2)} .rate.r3 b,.r3t{color:var(--r3)} .rate.r4 b,.r4t{color:var(--r4)}
.rate:hover{border-color:currentColor}

/* Meine Klassen */
.myclasses tr.mtype td{font-family:var(--f-display);font-weight:600;padding-top:12px;border-bottom:2px solid var(--line)}
.myclasses tr.mna td{color:var(--muted)}
.myclasses tr.on td{background:var(--accent-bg)}
.myclasses label.chk{display:flex;gap:8px;align-items:center;white-space:nowrap}
.myclasses .gnames{display:flex;gap:6px;flex-wrap:wrap}
.myclasses .gnames input{width:90px}
.myclasses select{width:auto}
.myclasses input[type=checkbox]{width:auto;margin:0}

/* tiles (Heute) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tile{border-radius:10px;padding:12px 14px;color:#fff;display:grid;gap:2px;text-decoration:none;min-width:0}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-size:13px;opacity:.95}
.tile.t1{background:var(--tile-blue)} .tile.t2{background:var(--tile-orange)} .tile.t3{background:var(--tile-green)} .tile.t4{background:var(--tile-slate)} .tile.t4.neg{background:var(--tile-red)}

/* caps */
.caps{display:flex;flex-wrap:wrap;gap:10px}
.cap{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:8px 12px;display:grid;gap:2px;min-width:170px}
.cap .nums{display:flex;gap:12px;font-size:13px;color:var(--muted)} .cap .nums b{color:var(--ink)}
.cap .res{font-size:13px}
.cap.neg{border-color:var(--warn)} .cap.neg .res{color:var(--warn);font-weight:600}
.cap.pos .res{color:var(--ok)}

/* tables */
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink);font-weight:600;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.plan{background:var(--sheet)}
table.plan th{white-space:normal}
table.plan td{vertical-align:top}
table.plan .hrs{display:inline-block;margin-left:6px;font-size:12px;color:var(--muted)}
table.plan tr.hol td{background:var(--soft);color:var(--muted)}
table.plan tr.cur td{background:var(--lb1-bg)}
table.plan td.note{font-size:12.5px;color:var(--muted)}
.xchip{font-size:12px;color:var(--warn)}
/* Jahresplan: Einheiten, Leistungsnachweise und Kontrollen als anklickbare Einträge, Bearbeiten-Leiste unter der Woche */
.ptools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ptools .sp{flex:1}
.phint{margin:0}
table.plan .pu,table.plan .pln{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:1px 0;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;line-height:1.35}
table.plan .pu:hover,table.plan .pln:hover{background:var(--soft)}
.pu b,.pln b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--c);background:var(--bg);padding:1px 6px;border-radius:4px;flex-shrink:0}
.pu .put,.pln .put{font-weight:600;min-width:0}
table.plan .pu .hrs,table.plan .pln .hrs{margin-left:auto;white-space:nowrap}
table.plan .pu,table.plan .pln{flex-wrap:wrap;row-gap:2px}
table.plan .pu.sel{border-color:var(--c);background:var(--bg)}
table.plan .pln{border:1px dashed var(--line)}
table.plan .pln.sel{border:2px solid var(--c);background:var(--sheet)}
table.plan .pln[draggable="true"]{cursor:grab}
table.plan .pln.part{color:var(--muted)} table.plan .pln.part .put{font-weight:500}
.pln .grip{color:var(--muted);letter-spacing:-3px;flex-shrink:0}
.pln .when{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap}
.pln.dragging{opacity:.45}
table.plan tr.dropwk td{background:var(--accent-bg);box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.padd{display:block;font-size:12.5px;opacity:0;transition:opacity .1s}
table.plan tr:hover .padd,.padd:focus-visible{opacity:1}
@media (hover:none){.padd{opacity:1}}
table.plan tr.pedit td{background:var(--soft);padding:10px}
.pcard{background:var(--sheet);border:1px solid var(--c,var(--line));border-radius:8px;padding:12px 14px;display:grid;gap:10px}

.bx.bxdrop-b::before,.bx.bxdrop-a::before{content:"";position:absolute;left:-4px;right:-4px;height:4px;border-radius:2px;background:var(--accent);z-index:3;border:0;inset-inline:-4px;opacity:1}

.bxnewbtn{min-height:44px;border:2px dashed var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit;font-weight:600;text-align:left;padding:0 12px;cursor:pointer}

.bxside summary::-webkit-details-marker{display:none}
.bxside summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;align-self:center}

.bxbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden} .bxbar span{display:block;height:100%;background:var(--accent);border-radius:5px}

.uplan{display:grid;gap:10px}
.ulnform .wide0{flex:1 1 100%;margin:0}
.lcheck{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--warn-bg)}
.lcheck .mini{margin-left:auto}
.pill.lnp{border-color:var(--warn);color:var(--warn)}
#banner[data-kind="backup"]{background:var(--warn-bg);color:var(--warn)} #banner a{color:inherit}
.tplnote{border-color:var(--accent);margin-bottom:14px} .tpldiff{margin:0;padding-left:18px}
.tplstate{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin:0 0 14px}
.tplstate details{flex-basis:100%} .tplstate summary{cursor:pointer;color:var(--accent)}
.tplcard code{font-size:12px}
.chkform{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:8px;background:var(--soft);border-radius:6px}
.chkform label{display:grid;gap:3px;font-size:13px}
.chkform label.wide{flex:1 1 200px}
.chkform label.wide input{width:100%}
.lacts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.lnedit{display:grid;gap:8px}
.lnedit label{display:grid;gap:3px;font-size:13px}
.lnedit textarea,.lnedit input{width:100%;box-sizing:border-box;font:inherit}
.aform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;padding:10px;background:var(--soft);border-radius:6px}
.aform label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.aform .acts{grid-column:1/-1}

/* engine */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid}
.stat .v{font-size:26px;font-weight:500} .stat .v small{font-size:14px;color:var(--muted)}
.stat .l{font-size:13px;color:var(--muted)}
.rlist{margin:0;padding-left:18px}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(10,16,20,.55);z-index:20;display:grid;place-items:center;padding:16px}
.ov-card{background:var(--sheet);border-radius:12px;padding:20px 24px;width:min(860px,100%);max-height:100%;overflow:auto;display:grid;gap:14px}
.ov-card header{display:flex;gap:10px;align-items:center;justify-content:space-between}
/* Einrichtungsassistent */
.ov-card.onboard{width:min(980px,100%);max-height:calc(100vh - 32px);grid-template-rows:auto auto minmax(0,1fr) auto}
.onboard .obbody{overflow:auto;display:grid;gap:12px;align-content:start;padding-right:4px}
.onboard .obbody p{margin:0}
.onboard .obbody .card{gap:4px}
.onboard footer{border-top:1px solid var(--line);padding-top:12px}
.onboard footer .sp{flex:1}
.obsteps{display:flex;gap:6px;list-style:none;margin:0;padding:0;counter-reset:ob;flex-wrap:wrap}
.obsteps li{counter-increment:ob;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--soft)}
.obsteps li::before{content:counter(ob);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;font-weight:600}
.obsteps li.cur{color:var(--accent);background:var(--accent-bg);font-weight:600}
.obsteps li.cur::before{background:var(--accent);color:var(--accent-ink)}
.obsteps li.done::before{content:"✓";background:var(--ok-bg);color:var(--ok)}
.obtype{font-size:14px;margin-top:4px}
.obclasses tr.on td{background:var(--accent-bg)}
.obclasses label.chk{display:flex;gap:8px;align-items:center}
.obclasses input[type=checkbox]{width:auto;margin:0}
.obclasses .gnames{display:flex;gap:6px;flex-wrap:wrap}
.obclasses .gnames input{width:90px}
.obclasses select{width:auto}
.obgrids{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.obgrid{gap:6px}
.obgrid .obh{display:flex;flex-direction:column}
.obgrid table{border-collapse:separate;border-spacing:3px;width:auto}
.obgrid th{border:0;padding:0 4px;font-size:11px;text-align:center}
.obgrid td{border:0;padding:0}
.obcell{width:38px;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);cursor:pointer;font-size:12px;font-weight:600;color:var(--accent-ink);padding:0}
.obcell:hover{border-color:var(--accent)}
.obcell.on{background:var(--accent);border-color:var(--accent)}
.obplans{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.obplan{display:grid;gap:8px;align-content:start}
.oblbs td{padding:3px 6px;font-size:13px}
.oblbs td:last-child{width:1%}
.oblbs select{width:auto!important;min-width:64px}
.obcell{position:relative}
.obcell.dtop{border-bottom-left-radius:0;border-bottom-right-radius:0}
.obcell.dbot{border-top-left-radius:0;border-top-right-radius:0}
.obcell.dtop::after{content:"";position:absolute;left:-1px;right:-1px;top:100%;height:8px;background:var(--accent)}
.quiz{min-height:min(520px,90vh);align-content:center}
.quiz header{align-self:start}
.qq{font-family:var(--f-display);font-size:clamp(26px,5vw,48px);font-weight:600;text-align:center;line-height:1.2;padding:20px 0}
.qa{font-family:var(--f-mono);font-size:clamp(20px,3.5vw,32px);text-align:center;background:var(--soft);border-radius:8px;padding:12px}
.big{font-size:20px}
/* Quiz im Vollbild */
#overlay:fullscreen{padding:24px;background:var(--paper)}
#overlay:fullscreen .ov-card.quiz{width:min(1400px,100%);height:100%;max-height:none;min-height:0;border-radius:14px}
#overlay:fullscreen .qq{font-size:clamp(34px,6vw,84px)}
#overlay:fullscreen .qa{font-size:clamp(26px,4.5vw,60px)}
#overlay:fullscreen .rates{max-width:900px;justify-self:center;width:100%}
#overlay::backdrop{background:var(--paper)}
.quiz header{justify-content:flex-start}
.quiz header .mono{margin-left:auto}
.btn .muted{color:inherit;opacity:.8}
#overlay:fullscreen .ov-card.quiz{position:relative;padding-top:80px}
#overlay:fullscreen .quiz header{position:absolute;top:22px;left:24px;right:24px}
ol.sol{margin:0;padding-left:22px;display:grid;gap:8px} ol.sol span{display:block;font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast button{background:none;border:1px solid var(--paper);color:var(--paper);border-radius:5px;padding:3px 10px;cursor:pointer}
[hidden]{display:none!important}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:8px}
  .side .mk{margin:0}
  .side .mk img{height:30px}
  .side .mk span{display:none}
  #nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1}
  #nav a{padding:6px 10px}
  #nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brand-blue)}
  .side .full{display:none}
  .ctxbar{position:static}
}
@media (max-width:640px){
  .ctx .ctxl{display:none}
  .ctx .grades{order:3}
  .slot{grid-template-columns:1fr}
  .rates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .datebar .seg{margin-left:0}
  .lhead{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){main>section{animation:fade .15s ease-out}}
@keyframes fade{from{opacity:.5}to{opacity:1}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <a class="mk" href="#heute" aria-label="Matheplaner, Heute"><img src="logo-mark.svg" alt=""><span>Matheplaner</span></a>
  <nav id="nav" aria-label="Ansichten"></nav>
  <img class="full" src="logo.svg" alt="FELS – Freies Evangelisches Limbacher Schulzentrum">
</aside>
<div class="col">
<div class="ctxbar"><div id="ctx" class="ctx"></div></div>
<div id="banner" role="status" hidden></div>
<main id="main"><p class="muted">Lädt …</p></main>
<footer id="footnote" class="foot" hidden></footer>
</div>
</div>
<div id="overlay" hidden></div>
<div id="toast" role="status" hidden></div>
<script>

   ohne MathJax bleibt der normale Text stehen. */

};
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>

<script src="app.js"></script>
</body>
</html>
